# =====================================================================
# Pearl Framework — Production Nginx Configuration
# Place in: /etc/nginx/sites-available/pearl.conf
# Symlink:  ln -s /etc/nginx/sites-available/pearl.conf /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Document root MUST point directly to public/
    root /var/www/pearl/public;
    index index.php;

    charset utf-8;

    # Logging
    access_log /var/log/nginx/pearl_access.log;
    error_log /var/log/nginx/pearl_error.log warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Client Request Limits
    client_max_body_size 32M;

    # Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets & Vite Production Cache (1 year immutable)
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # FastCGI buffer tuning
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # Block access to hidden dotfiles (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block access to internal application directories if accidentally reachable
    location ~* ^/(pearl|config|database|wire|storage|ink)/ {
        deny all;
        return 404;
    }
}
