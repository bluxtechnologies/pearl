; =====================================================================
; Pearl Framework — Supervisor Worker Configuration
; Place in: /etc/supervisor/conf.d/pearl-worker.conf
; Reload:   supervisorctl reread && supervisorctl update && supervisorctl start pearl-worker:*
; =====================================================================

[program:pearl-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/pearl/bin/pearl notify:work --sleep=2
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/pearl/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
