# =====================================================================
# Pearl Framework — Production Apache VirtualHost Configuration
# Place in: /etc/apache2/sites-available/pearl.conf
# Enable:   a2ensite pearl.conf && systemctl reload apache2
# =====================================================================

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com

    # DocumentRoot MUST point directly to the public folder
    DocumentRoot /var/www/pearl/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    <Directory /var/www/pearl/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Fallback in case .htaccess is ignored
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # Block access to hidden files and internal directories
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # Pass to PHP-FPM
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/pearl_error.log
    CustomLog ${APACHE_LOG_DIR}/pearl_access.log combined
</VirtualHost>
